<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1f24"/>
      <stop offset="100%" stop-color="#050a0d"/>
    </radialGradient>
    <radialGradient id="earthGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#0e4b5e"/>
      <stop offset="85%" stop-color="#061f26"/>
      <stop offset="100%" stop-color="#02090c"/>
    </radialGradient>
    <linearGradient id="atmoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#061b24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#059669" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#34d39940" stroke-width="1.5"/>

  <!-- Atmosphere halo -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="url(#atmoGlow)" stroke-width="2.5" opacity="0.8"/>

  <!-- Earth sphere -->
  <circle cx="32" cy="32" r="16" fill="url(#earthGrad)"/>

  <!-- Continents styling (abstract continental landmasses in emerald / mint) -->
  <path d="M 23 24 Q 27 20 31 23 Q 35 26 34 31 Q 29 34 25 32 Q 22 29 23 24 Z" fill="#34d399" opacity="0.9"/>
  <path d="M 36 21 Q 41 19 44 22 Q 43 26 39 27 Q 36 25 36 21 Z" fill="#6ee7b7" opacity="0.85"/>
  <path d="M 33 33 Q 38 32 41 36 Q 39 41 34 42 Q 31 39 33 33 Z" fill="#10b981" opacity="0.85"/>
  <path d="M 22 34 Q 26 36 25 40 Q 20 41 21 37 Z" fill="#059669" opacity="0.75"/>

  <!-- Orbital Chronosphere Ring -->
  <ellipse cx="32" cy="32" rx="25.5" ry="9" transform="rotate(-30 32 32)" fill="none" stroke="url(#ringGrad)" stroke-width="2.2"/>

  <!-- Time Milestone beacon / Moon node -->
  <circle cx="50" cy="18" r="3.2" fill="#6ee7b7"/>
  <circle cx="50" cy="18" r="1.8" fill="#ffffff"/>
</svg>