name: Deploy AEON to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Prepare project-path assets
        run: node scripts/prepare-github-pages.mjs

      - name: Build static site
        run: npm run build

      - name: Stage static export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-out
          for dir in out dist/client dist/static dist; do
            if [ -f "$dir/index.html" ]; then
              mkdir -p pages-out
              cp -a "$dir"/. pages-out/
              echo "Using static export from $dir"
              exit 0
            fi
          done

          index_file="$(find . -maxdepth 6 -type f -name index.html -not -path './node_modules/*' -not -path './.git/*' | head -n 1 || true)"
          if [ -n "$index_file" ]; then
            root="$(dirname "$index_file")"
            mkdir -p pages-out
            cp -a "$root"/. pages-out/
            echo "Using discovered static export from $root"
            exit 0
          fi

          echo "Could not find the generated static site. HTML files found:"
          find . -maxdepth 6 -type f -name '*.html' -not -path './node_modules/*' -not -path './.git/*' -print || true
          exit 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
