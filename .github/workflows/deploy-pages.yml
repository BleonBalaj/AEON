name: Deploy AEON to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --legacy-peer-deps vinext@1.0.0-beta.9 @vitejs/plugin-rsc@0.5.34

      - name: Prepare project-path assets
        run: node scripts/prepare-github-pages.mjs

      - name: Build static site
        run: npm run build -- --prerender-all

      - name: Stage static export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-out
          if [ -f dist/client/AEON/index.html ]; then
            mkdir -p pages-out
            cp -a dist/client/. pages-out/
            touch pages-out/.nojekyll
            echo "Staged AEON static export"
          else
            echo "AEON static export was not generated. HTML files found:"
            find dist -type f -name '*.html' -print || true
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
